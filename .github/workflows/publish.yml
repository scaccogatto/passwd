name: Publish to npm

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'pepuscz/passwd'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: node --test packages/*/dist/__tests__/*.test.js

      # Skip a package only when npm already has this exact version. Any
      # other failure (auth, provenance, E403) fails the job.
      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail
          for pkg in passwd-lib passwd-mcp passwd-cli passwd-agent-cli; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            published=$(npm view "$name@$version" version 2>/dev/null || true)
            if [ "$published" = "$version" ]; then
              echo "$name@$version is already on npm, skipping"
              continue
            fi
            npm publish --workspace "packages/$pkg" --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-mcpb:
    if: github.repository == 'pepuscz/passwd'
    runs-on: macos-latest
    needs: publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      - name: Build .mcpb
        run: bash packages/passwd-mcpb/build.sh

      - name: Upload .mcpb artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: passwd.mcpb
          path: packages/passwd-mcpb/passwd.mcpb

  release-mcpb:
    runs-on: ubuntu-latest
    needs: build-mcpb
    if: github.repository == 'pepuscz/passwd' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download .mcpb artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: passwd.mcpb

      # gh is preinstalled on the runner, so no third-party action needs
      # contents: write.
      - name: Attach .mcpb to release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes
          fi
          gh release upload "$TAG" passwd.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
